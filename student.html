<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Mandarin_V2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/40 min-h-screen font-sans flex flex-col text-stone-800">

  <!-- 頂部提示條 (Toast) -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 transform -translate-y-20 opacity-0 pointer-events-none px-4 py-2 rounded-xl shadow-lg text-xs font-semibold"></div>

  <!-- 頂部導覽列 -->
  <header class="bg-white/80 backdrop-blur border-b border-stone-200 sticky top-0 z-40 px-4 py-3 sm:px-8 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <span class="w-3 h-3 bg-amber-500 rounded-full animate-pulse"></span>
      <h1 class="text-xl sm:text-2xl font-black text-amber-950 tracking-tight">Mandarin</h1>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- 模式標籤 -->
      <span id="uiModeBadge" class="hidden sm:inline-block text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-medium">
        跟讀練習模式
      </span>

      <!-- 中英語言切換按鈕 -->
      <button onclick="toggleLanguage()" class="px-2.5 py-1 text-xs font-bold rounded-lg border border-stone-300 bg-white hover:bg-stone-50 active:scale-95 shadow-sm text-stone-700 transition flex items-center gap-1">
        🌐 <span id="langBtnText">EN</span>
      </button>

      <!-- 重新同步按鈕 -->
      <button onclick="loadFlashcards()" id="refreshBtn" title="重新同步教材" class="p-1.5 text-stone-500 hover:text-stone-800 hover:bg-stone-100 rounded-lg transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>
  </header>

  <!-- 主體區塊 -->
  <div class="max-w-6xl w-full mx-auto p-4 sm:p-6 flex-1 flex flex-col md:flex-row gap-6">

    <!-- 左側：生字快速選單列表 (Sidebar) -->
    <aside class="w-full md:w-80 flex flex-col bg-white rounded-2xl shadow-sm border border-stone-200 p-4 h-[380px] md:h-[720px]">
      <div class="mb-3">
        <label id="uiSidebarTitle" class="text-xs font-bold text-stone-500 uppercase tracking-wider block mb-1.5">生字快速清單</label>
        <div class="relative">
          <input type="text" id="searchInput" oninput="filterCards()" placeholder="搜尋漢字、拼音或英文..." class="w-full pl-8 pr-3 py-1.5 bg-stone-50 border border-stone-200 rounded-lg text-xs focus:ring-2 focus:ring-amber-500 outline-none">
          <svg class="w-3.5 h-3.5 text-stone-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>

      <!-- 清單內容 -->
      <div id="sidebarList" class="flex-1 overflow-y-auto space-y-1.5 pr-1 text-sm">
        <div id="uiLoadingList" class="text-center text-stone-400 py-10 text-xs">載入清單中...</div>
      </div>
      
      <div class="pt-3 border-t border-stone-100 text-[11px] text-stone-400 text-center">
        <span id="uiTotalPrefix">共</span> <span id="totalCount" class="font-bold text-stone-600">0</span> <span id="uiTotalSuffix">個生字</span>
      </div>
    </aside>

    <!-- 右側：沉浸式學習卡片主展示區 -->
    <main class="flex-1 flex flex-col items-center justify-center">
      
      <!-- 空狀態提示 -->
      <div id="emptyNotice" class="text-center py-20 text-stone-400 hidden">
        <p id="uiEmptyText" class="text-sm">請從左側清單選擇要學習的生字</p>
      </div>

      <!-- 生字聚焦卡片 -->
      <div id="focusCard" class="w-full max-w-lg bg-white rounded-3xl shadow-md border border-stone-100 overflow-hidden flex flex-col transition-all">
        
        <!-- 圖片展示 -->
        <div class="relative w-full h-52 sm:h-60 bg-amber-50/50 flex items-center justify-center overflow-hidden border-b border-stone-100">
          <img id="cardImage" src="" alt="生字插圖" class="w-full h-full object-cover hidden">
          <div id="noImagePlaceholder" class="text-stone-300 text-xs flex flex-col items-center gap-1">
            <svg class="w-10 h-10 stroke-current" fill="none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span id="uiNoImage">暫無插圖</span>
          </div>
          
          <!-- 圖片右下角浮動播放老師發音鈕 -->
          <button id="floatingPlayBtn" onclick="triggerCurrentAudio()" title="聽老師發音" class="absolute bottom-4 right-4 bg-amber-500 hover:bg-amber-600 active:scale-90 text-white p-3 rounded-full shadow-lg transition flex items-center justify-center">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>
        </div>

        <!-- 卡片文字區 -->
        <div class="p-6 sm:p-7 flex flex-col items-center text-center">
          
          <!-- 拼音（與漢字同為 text-5xl sm:text-6xl） -->
          <div id="cardPinyin" class="text-5xl sm:text-6xl font-black text-amber-700 tracking-wide select-none my-1">
            ---
          </div>

          <!-- 注音符號（輔助字體） -->
          <div id="cardZhuyin" class="text-xs sm:text-sm text-stone-400 font-medium mb-1">
            ---
          </div>

          <!-- 核心漢字（點擊亦可播放） -->
          <div id="cardHanzi" onclick="triggerCurrentAudio()" title="點擊聽老師發音" class="text-5xl sm:text-6xl font-black text-stone-900 cursor-pointer hover:text-amber-600 active:scale-95 transition-all select-none my-1">
            ---
          </div>

          <!-- 英文翻譯（比中文字小 2 號：text-3xl sm:text-4xl） -->
          <div id="cardEnglish" class="text-3xl sm:text-4xl font-extrabold text-stone-600 my-2 tracking-tight">
            ---
          </div>

          <!-- 例句區塊 -->
          <div id="sentenceBox" class="w-full bg-stone-50 rounded-xl p-3 border border-stone-100 text-left mb-5">
            <div id="uiSentenceLabel" class="text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-0.5">實用例句</div>
            <p id="cardSentence" class="text-stone-700 text-xs sm:text-sm leading-relaxed">---</p>
          </div>

          <!-- 發音跟讀與對比控制區 -->
          <div class="w-full bg-amber-50/60 rounded-2xl p-4 border border-amber-100 flex flex-col gap-3">
            <div class="text-xs font-bold text-stone-700 flex items-center justify-between">
              <span id="uiPracticeTitle">口說發音演練</span>
              <span id="recordTimer" class="text-[11px] text-stone-400 font-mono">00:00</span>
            </div>

            <!-- 控制列：單純 🔊 圖示 + 錄音按鈕 -->
            <div class="flex items-center gap-2.5">
              <!-- 教師發音按鈕（僅保留 🔊 符號） -->
              <button id="teacherPlayBtn" onclick="triggerCurrentAudio()" title="聽老師發音" class="w-12 h-11 shrink-0 bg-white hover:bg-stone-50 active:scale-95 border border-stone-200 text-stone-800 rounded-xl text-lg shadow-sm transition flex items-center justify-center">
                <span>🔊</span>
              </button>

              <!-- 學生跟讀錄音按鈕 -->
              <button id="studentRecordBtn" onclick="toggleStudentRecording()" class="flex-1 h-11 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white rounded-xl text-xs font-bold shadow-sm transition flex items-center justify-center gap-1.5">
                <span id="recDot" class="w-2 h-2 rounded-full bg-white"></span>
                <span id="recBtnText">🎤 開始跟讀</span>
              </button>
            </div>

            <!-- 比對播放面板（錄音完成後自動展開） -->
            <div id="comparePanel" class="hidden pt-3 border-t border-amber-200/60 flex flex-col gap-2">
              <div class="flex items-center justify-between text-[11px] text-stone-500">
                <span id="uiRecordDone">我的錄音已完成：</span>
                <span id="uiReadyCompare" class="text-emerald-600 font-semibold">✓ 隨時可比對</span>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="playStudentAudio()" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-lg text-xs font-semibold shadow-sm transition flex items-center justify-center gap-1">
                  <span id="uiListenMine">▶ 聽我的發音</span>
                </button>
                <button onclick="playCompareBoth()" class="py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-lg text-xs font-semibold shadow-sm transition flex items-center justify-center gap-1">
                  <span id="uiCompareAB">⇄ 聽 AB 連續對比</span>
                </button>
              </div>
            </div>

          </div>

        </div>
      </div>

    </main>
  </div>

  <!-- 全域音訊物件 -->
  <audio id="teacherAudio"></audio>
  <audio id="studentAudio"></audio>

  <script>
    // ==========================================
    // ⚠️ 請替換為你的 Google Apps Script Web App 網址
    // ==========================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxwqjU6qdPHLyL-Cd0EIwePjqhN6JTEj4ci6OOnkc2GEPjoUlYvHZkL5jAnynUSyJJe/exec';

    let flashcardsData = [];
    let currentIndex = 0;
    let currentLang = localStorage.getItem('site_lang') || 'zh'; // 'zh' or 'en'

    // 多語系字典定義
    const i18n = {
      zh: {
        modeBadge: "跟讀練習模式",
        langToggle: "EN",
        refreshTip: "重新同步教材",
        sidebarTitle: "生字快速清單",
        searchPlaceholder: "搜尋漢字、拼音或英文...",
        loadingList: "載入清單中...",
        totalPrefix: "共",
        totalSuffix: "個生字",
        noCardsFound: "查無相符生字",
        emptyNotice: "請從左側清單選擇要學習的生字",
        noImage: "暫無插圖",
        sentenceLabel: "實用例句",
        noSentence: "（無例句）",
        practiceTitle: "口說發音演練",
        recordStart: "🎤 開始跟讀",
        recordStop: "停止跟讀",
        recordRetry: "重新跟讀",
        recordDone: "我的錄音已完成：",
        readyCompare: "✓ 隨時可比對",
        listenMine: "▶ 聽我的發音",
        compareAB: "⇄ 聽 AB 連續對比",
        toastNoAudio: "該生字尚未錄製發音檔",
        toastTeacherFail: "老師發音播放失敗",
        toastRecordDone: "跟讀錄音完成！可點擊下方進行發音比對",
        toastMicDenied: "無法取得麥克風權限，請確認瀏覽器已允許麥克風。",
        toastNoStudentAudio: "尚未錄製個人發音",
        toastCompareHint: "🔊 正在播放：先聽老師，再聽自己",
        toastLoadFail: "載入教材失敗，請檢查網路連線"
      },
      en: {
        modeBadge: "Practice Mode",
        langToggle: "中文",
        refreshTip: "Sync Cards",
        sidebarTitle: "Word List",
        searchPlaceholder: "Search Hanzi, Pinyin or English...",
        loadingList: "Loading list...",
        totalPrefix: "Total",
        totalSuffix: "words",
        noCardsFound: "No matching words found",
        emptyNotice: "Please select a word from the list",
        noImage: "No Image",
        sentenceLabel: "Example Sentence",
        noSentence: "(No example)",
        practiceTitle: "Speaking Practice",
        recordStart: "🎤 Record Voice",
        recordStop: "Stop Recording",
        recordRetry: "Record Again",
        recordDone: "Recording ready:",
        readyCompare: "✓ Ready to compare",
        listenMine: "▶ Play Mine",
        compareAB: "⇄ Compare (Teacher → Me)",
        toastNoAudio: "No teacher audio for this card",
        toastTeacherFail: "Failed to play teacher audio",
        toastRecordDone: "Recorded! Click below to compare.",
        toastMicDenied: "Microphone access denied. Please allow microphone permissions.",
        toastNoStudentAudio: "Please record your voice first",
        toastCompareHint: "🔊 Playing: Teacher first, then yours",
        toastLoadFail: "Failed to load flashcards, check network"
      }
    };

    function updateLanguageUI() {
      const t = i18n[currentLang];
      document.getElementById('langBtnText').innerText = t.langToggle;
      document.getElementById('uiModeBadge').innerText = t.modeBadge;
      document.getElementById('refreshBtn').title = t.refreshTip;
      document.getElementById('uiSidebarTitle').innerText = t.sidebarTitle;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('uiTotalPrefix').innerText = t.totalPrefix;
      document.getElementById('uiTotalSuffix').innerText = t.totalSuffix;
      document.getElementById('uiEmptyText').innerText = t.emptyNotice;
      document.getElementById('uiNoImage').innerText = t.noImage;
      document.getElementById('uiSentenceLabel').innerText = t.sentenceLabel;
      document.getElementById('uiPracticeTitle').innerText = t.practiceTitle;
      document.getElementById('uiRecordDone').innerText = t.recordDone;
      document.getElementById('uiReadyCompare').innerText = t.readyCompare;
      document.getElementById('uiListenMine').innerText = t.listenMine;
      document.getElementById('uiCompareAB').innerText = t.compareAB;

      if (!isRecording) {
        document.getElementById('recBtnText').innerText = studentAudioBlob ? t.recordRetry : t.recordStart;
      }
    }

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('site_lang', currentLang);
      updateLanguageUI();
      filterCards();
    }

    // 學生錄音狀態管理
    let mediaRecorder;
    let studentChunks = [];
    let studentAudioBlob = null;
    let studentAudioUrl = null;
    let isRecording = false;
    let recordInterval = null;
    let recordSeconds = 0;

    const teacherAudio = document.getElementById('teacherAudio');
    const studentAudio = document.getElementById('studentAudio');

    // 顯示 Toast 提示
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.className = `fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 transform translate-y-0 opacity-100 px-4 py-2 rounded-xl shadow-lg text-xs font-semibold ${
        isError ? 'bg-rose-600 text-white' : 'bg-stone-900 text-white'
      }`;
      setTimeout(() => {
        toast.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 transform -translate-y-20 opacity-0 pointer-events-none px-4 py-2 rounded-xl shadow-lg text-xs font-semibold';
      }, 3000);
    }

    // 擷取 Google Drive 檔案 ID
    function extractDriveId(urlOrId) {
      if (!urlOrId) return '';
      const str = String(urlOrId).trim();
      const match = str.match(/[-\w]{25,}/);
      return match ? match[0] : str;
    }

    // 圖片直連轉換
    function parseDriveImageUrl(rawInput) {
      const fileId = extractDriveId(rawInput);
      return fileId ? `https://lh3.googleusercontent.com/d/${fileId}` : '';
    }

    // 播放老師發音（回傳 Promise，直到音檔播完才 resolve）
    async function playTeacherAudio(audioInput) {
      const fileId = extractDriveId(audioInput);
      if (!fileId) {
        showToast(i18n[currentLang].toastNoAudio, true);
        return Promise.reject('No audio ID');
      }

      const teacherPlayBtn = document.getElementById('teacherPlayBtn');

      try {
        teacherPlayBtn.innerHTML = '<span>⏳</span>';
        teacherPlayBtn.disabled = true;

        const res = await fetch(`${SCRIPT_URL}?audioId=${fileId}`);
        const result = await res.json();

        if (result.status !== 'success' || !result.data) {
          throw new Error(result.message || 'Cannot fetch audio');
        }

        teacherAudio.src = `data:${result.mimeType || 'audio/mpeg'};base64,${result.data}`;
        teacherPlayBtn.innerHTML = '<span>🔊</span>';

        return new Promise((resolve) => {
          teacherAudio.onended = () => {
            teacherPlayBtn.innerHTML = '<span>🔊</span>';
            teacherPlayBtn.disabled = false;
            resolve();
          };
          teacherAudio.onerror = (e) => {
            teacherPlayBtn.innerHTML = '<span>🔊</span>';
            teacherPlayBtn.disabled = false;
            resolve();
          };
          teacherAudio.play();
        });

      } catch (err) {
        console.error('老師音訊播放錯誤：', err);
        showToast(i18n[currentLang].toastTeacherFail, true);
        teacherPlayBtn.innerHTML = '<span>🔊</span>';
        teacherPlayBtn.disabled = false;
        return Promise.reject(err);
      }
    }

    function triggerCurrentAudio() {
      if (flashcardsData.length > 0 && flashcardsData[currentIndex]) {
        return playTeacherAudio(flashcardsData[currentIndex].audio_url);
      }
      return Promise.reject('No card selected');
    }

    // --- 學生自主跟讀錄音 ---
    async function toggleStudentRecording() {
      const recBtn = document.getElementById('studentRecordBtn');
      const recText = document.getElementById('recBtnText');
      const recDot = document.getElementById('recDot');
      const timerEl = document.getElementById('recordTimer');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          studentChunks = [];

          mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) studentChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            studentAudioBlob = new Blob(studentChunks, { type: 'audio/webm' });
            if (studentAudioUrl) URL.revokeObjectURL(studentAudioUrl);
            studentAudioUrl = URL.createObjectURL(studentAudioBlob);
            studentAudio.src = studentAudioUrl;

            document.getElementById('comparePanel').classList.remove('hidden');
            showToast(i18n[currentLang].toastRecordDone);
          };

          mediaRecorder.start();
          isRecording = true;
          recText.innerText = i18n[currentLang].recordStop;
          recBtn.className = 'flex-1 h-11 bg-stone-900 hover:bg-stone-800 active:scale-95 text-white rounded-xl text-xs font-bold shadow-sm transition flex items-center justify-center gap-1.5';
          recDot.classList.add('animate-ping');

          recordSeconds = 0;
          timerEl.innerText = '00:00';
          recordInterval = setInterval(() => {
            recordSeconds++;
            const sec = String(recordSeconds % 60).padStart(2, '0');
            const min = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
            timerEl.innerText = `${min}:${sec}`;
          }, 1000);

        } catch (err) {
          console.error(err);
          showToast(i18n[currentLang].toastMicDenied, true);
        }
      } else {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        clearInterval(recordInterval);
        isRecording = false;
        recText.innerText = i18n[currentLang].recordRetry;
        recBtn.className = 'flex-1 h-11 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white rounded-xl text-xs font-bold shadow-sm transition flex items-center justify-center gap-1.5';
        recDot.classList.remove('animate-ping');
      }
    }

    // 播放學生的發音
    function playStudentAudio() {
      if (!studentAudioUrl) {
        showToast(i18n[currentLang].toastNoStudentAudio, true);
        return;
      }
      studentAudio.currentTime = 0;
      studentAudio.play();
    }

    // AB 對比連續播放（修正：保證先播老師，播完等待 500ms，再播放學生）
    async function playCompareBoth() {
      if (!studentAudioUrl) {
        showToast(i18n[currentLang].toastNoStudentAudio, true);
        return;
      }
      showToast(i18n[currentLang].toastCompareHint);

      try {
        // 1. 先播放老師音檔，並確實等待音檔 onended 結束
        await triggerCurrentAudio();
        
        // 2. 老師聲音結束後，短暫間隔 500ms
        setTimeout(() => {
          // 3. 播放學生錄音
          playStudentAudio();
        }, 500);
      } catch (e) {
        console.warn('AB 比對中斷或失敗', e);
      }
    }

    // 清除當前卡片的學生錄音
    function resetStudentRecording() {
      if (isRecording && mediaRecorder) {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        isRecording = false;
      }
      clearInterval(recordInterval);
      document.getElementById('recordTimer').innerText = '00:00';
      document.getElementById('recBtnText').innerText = i18n[currentLang].recordStart;
      document.getElementById('recDot').classList.remove('animate-ping');
      document.getElementById('studentRecordBtn').className = 'flex-1 h-11 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white rounded-xl text-xs font-bold shadow-sm transition flex items-center justify-center gap-1.5';
      document.getElementById('comparePanel').classList.add('hidden');
      studentAudioBlob = null;
      if (studentAudioUrl) URL.revokeObjectURL(studentAudioUrl);
      studentAudioUrl = null;
    }

    // 切換生字卡
    function selectCard(index) {
      if (!flashcardsData[index]) return;
      currentIndex = index;
      const card = flashcardsData[index];

      resetStudentRecording();

      // 更新生字與拼音
      document.getElementById('cardHanzi').innerText = card.hanzi || '';
      document.getElementById('cardPinyin').innerText = card.pinyin || '';
      document.getElementById('cardZhuyin').innerText = card.zhuyin || '';
      
      // 英文翻譯
      document.getElementById('cardEnglish').innerText = card.english || '';
      document.getElementById('cardSentence').innerText = card.sentence || i18n[currentLang].noSentence;

      // 圖片切換
      const imgEl = document.getElementById('cardImage');
      const placeholder = document.getElementById('noImagePlaceholder');
      const directImg = parseDriveImageUrl(card.image_url);

      if (directImg) {
        imgEl.src = directImg;
        imgEl.classList.remove('hidden');
        placeholder.classList.add('hidden');
        imgEl.onerror = () => {
          imgEl.classList.add('hidden');
          placeholder.classList.remove('hidden');
        };
      } else {
        imgEl.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }

      // 側邊欄選中高亮
      document.querySelectorAll('.sidebar-item').forEach((el, i) => {
        if (i === index) {
          el.className = 'sidebar-item w-full px-3 py-2.5 rounded-xl bg-amber-500 text-white font-bold flex items-center justify-between text-xs transition cursor-pointer shadow-sm';
        } else {
          el.className = 'sidebar-item w-full px-3 py-2.5 rounded-xl hover:bg-stone-50 text-stone-700 flex items-center justify-between text-xs transition cursor-pointer border border-transparent hover:border-stone-100';
        }
      });
    }

    // 渲染側邊欄清單
    function renderSidebar(cards) {
      const list = document.getElementById('sidebarList');
      list.innerHTML = '';

      if (cards.length === 0) {
        list.innerHTML = `<div class="text-center text-stone-400 py-8 text-xs">${i18n[currentLang].noCardsFound}</div>`;
        return;
      }

      cards.forEach((card) => {
        const item = document.createElement('div');
        item.className = 'sidebar-item w-full px-3 py-2.5 rounded-xl hover:bg-stone-50 text-stone-700 flex items-center justify-between text-xs transition cursor-pointer';
        item.innerHTML = `
          <div class="flex items-center gap-2 truncate">
            <span class="font-black text-sm">${card.hanzi}</span>
            <span class="text-[11px] opacity-75 truncate">${card.pinyin || ''}</span>
          </div>
          <span class="text-[10px] opacity-60 ml-2 shrink-0">${card.english || ''}</span>
        `;
        item.addEventListener('click', () => {
          const originalIndex = flashcardsData.findIndex(c => c === card);
          selectCard(originalIndex);
        });
        list.appendChild(item);
      });
    }

    // 關鍵字搜尋過濾
    function filterCards() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!keyword) {
        renderSidebar(flashcardsData);
        return;
      }
      const filtered = flashcardsData.filter(c => 
        (c.hanzi && c.hanzi.toLowerCase().includes(keyword)) ||
        (c.pinyin && c.pinyin.toLowerCase().includes(keyword)) ||
        (c.zhuyin && c.zhuyin.toLowerCase().includes(keyword)) ||
        (c.english && c.english.toLowerCase().includes(keyword))
      );
      renderSidebar(filtered);
    }

    // 從 Apps Script 讀取教材
    async function loadFlashcards() {
      const list = document.getElementById('sidebarList');
      list.innerHTML = `<div class="text-center text-stone-400 py-10 text-xs">${i18n[currentLang].loadingList}</div>`;

      try {
        const res = await fetch(SCRIPT_URL);
        flashcardsData = await res.json();

        document.getElementById('totalCount').innerText = flashcardsData.length;

        if (flashcardsData.length === 0) {
          list.innerHTML = `<div class="text-center text-stone-400 py-10 text-xs">${i18n[currentLang].noCardsFound}</div>`;
          document.getElementById('focusCard').classList.add('hidden');
          document.getElementById('emptyNotice').classList.remove('hidden');
          return;
        }

        document.getElementById('focusCard').classList.remove('hidden');
        document.getElementById('emptyNotice').classList.add('hidden');

        renderSidebar(flashcardsData);
        selectCard(0);

      } catch (err) {
        console.error(err);
        showToast(i18n[currentLang].toastLoadFail, true);
        list.innerHTML = '<div class="text-center text-rose-500 py-10 text-xs">Load Failed</div>';
      }
    }

    // 初始化介面語系與載入資料
    updateLanguageUI();
    loadFlashcards();
  </script>
</body>
</html>
