<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Mandarin - 教師管理專區</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入穩定開源拼音/注音解析庫 (pinyin-pro) -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>
</head>
<body class="bg-amber-50/40 min-h-screen p-4 sm:p-8 font-sans flex flex-col items-center">

  <!-- 浮動訊息通知 (Toast) -->
  <div id="toast" class="fixed top-5 z-50 transition-all duration-300 transform -translate-y-20 opacity-0 pointer-events-none px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold"></div>

  <!-- 標題列 -->
  <header class="text-center mb-8">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-amber-950 tracking-tight">Mandarin 教師管理專區</h1>
    <p class="text-stone-500 text-sm mt-1.5">雲端教材編輯 · 自動辨識生成 · 錄音發布</p>
  </header>

  <!-- 新增字卡表單區塊 -->
  <section class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6 max-w-xl w-full mb-10">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-bold text-stone-800 flex items-center gap-2">
        <span class="w-2.5 h-2.5 bg-amber-500 rounded-full"></span>
        新增生字卡與錄音
      </h2>
      <span class="text-[11px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium">教師專區</span>
    </div>

    <form id="createForm" class="space-y-4">
      <!-- 漢字輸入與自動辨識按鈕 -->
      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">漢字 *</label>
        <div class="flex gap-2">
          <input type="text" id="hanzi" required placeholder="輸入漢字，例如：蘋果" class="flex-1 px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
          <button type="button" onclick="autoFillDetails('create')" id="btnAutoFillCreate" class="px-3.5 py-2 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-sm shrink-0">
            <span>✨ AI 自動填寫</span>
          </button>
        </div>
        <p class="text-[11px] text-stone-400 mt-1">輸入漢字後點擊按鈕，即時帶出拼音、注音、英譯與例句</p>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">漢語拼音</label>
          <input type="text" id="pinyin" placeholder="例如：píng guǒ" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">注音符號</label>
          <input type="text" id="zhuyin" placeholder="例如：ㄆㄧㄥˊ ㄍㄨㄛˇ" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">英文翻譯</label>
        <input type="text" id="english" placeholder="例如：Apple" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">例句</label>
        <input type="text" id="sentence" placeholder="例如：這顆蘋果很甜，非常好吃。" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">字卡圖片</label>
        <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-stone-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200 cursor-pointer">
      </div>

      <div class="border border-dashed border-stone-300 rounded-xl p-3.5 bg-stone-50 text-center">
        <label class="block text-xs font-bold text-stone-700 mb-2">教師標準發音錄音</label>
        <div class="flex items-center justify-center gap-3">
          <button type="button" id="recordBtn" class="px-3.5 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-medium flex items-center gap-1.5 shadow-sm transition">
            <span id="recordDot" class="w-2 h-2 rounded-full bg-white"></span>
            <span id="recordText">開始錄音</span>
          </button>
          <audio id="audioPreview" controls class="h-8 max-w-[200px] hidden"></audio>
        </div>
        <p id="recordStatus" class="text-[11px] text-stone-400 mt-1.5">點擊開始錄音（需允許麥克風權限）</p>
      </div>

      <button type="submit" id="submitBtn" class="w-full py-2.5 bg-amber-600 hover:bg-amber-700 active:scale-[0.99] text-white font-bold rounded-lg text-sm shadow transition disabled:opacity-50">
        同步儲存至 Google 雲端
      </button>
    </form>
  </section>

  <!-- 現有字卡列表區塊 -->
  <main class="max-w-5xl w-full">
    <div class="flex items-center justify-between mb-4 px-1">
      <h2 class="text-lg font-bold text-stone-800 flex items-center gap-2">
        <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full"></span>
        現有教材管理
      </h2>
      <button onclick="loadFlashcards()" class="text-xs px-3 py-1 bg-white hover:bg-stone-100 text-stone-600 rounded-lg border border-stone-200 shadow-sm transition">
        重新整理
      </button>
    </div>
    
    <div id="loading" class="text-center text-stone-400 py-12 text-sm flex flex-col items-center justify-center gap-2">
      <svg class="animate-spin h-6 w-6 text-amber-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" stroke-linecap="round" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span>正在讀取 Google 雲端教材...</span>
    </div>

    <!-- 字卡展示網格 -->
    <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5"></div>
  </main>

  <!-- 編輯字卡彈跳視窗 (Modal) -->
  <div id="editModal" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl shadow-xl max-w-lg w-full p-6 border border-stone-100 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4 border-b pb-3">
        <h3 class="text-base font-bold text-stone-800 flex items-center gap-2">
          <span>✏️</span> 編輯生字卡
        </h3>
        <button onclick="closeEditModal()" class="text-stone-400 hover:text-stone-700 text-lg">✕</button>
      </div>

      <form id="editForm" class="space-y-3.5">
        <input type="hidden" id="editRowIndex">

        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">漢字 *</label>
          <div class="flex gap-2">
            <input type="text" id="editHanzi" required class="flex-1 px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
            <button type="button" onclick="autoFillDetails('edit')" id="btnAutoFillEdit" class="px-3.5 py-2 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-sm shrink-0">
              <span>✨ 自動重辨</span>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-stone-600 mb-1">漢語拼音</label>
            <input type="text" id="editPinyin" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-600 mb-1">注音符號</label>
            <input type="text" id="editZhuyin" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">英文翻譯</label>
          <input type="text" id="editEnglish" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">例句</label>
          <input type="text" id="editSentence" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">更換圖片 (若不換請保留空白)</label>
          <input type="file" id="editImageInput" accept="image/*" class="w-full text-xs text-stone-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200 cursor-pointer">
        </div>

        <div class="border border-dashed border-stone-300 rounded-xl p-3 bg-stone-50 text-center">
          <label class="block text-xs font-bold text-stone-700 mb-1.5">重錄發音 (若不錄請保留空白)</label>
          <div class="flex items-center justify-center gap-3">
            <button type="button" id="editRecordBtn" class="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-medium flex items-center gap-1.5 shadow-sm transition">
              <span id="editRecordDot" class="w-2 h-2 rounded-full bg-white"></span>
              <span id="editRecordText">開始重錄</span>
            </button>
            <audio id="editAudioPreview" controls class="h-8 max-w-[180px] hidden"></audio>
          </div>
        </div>

        <div class="flex items-center justify-end gap-2.5 pt-3 border-t">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 border border-stone-200 text-stone-600 rounded-xl text-xs font-semibold hover:bg-stone-50 transition">
            取消
          </button>
          <button type="submit" id="saveEditBtn" class="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow-sm transition disabled:opacity-50">
            儲存變更
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 全域播放音訊物件 -->
  <audio id="globalAudio"></audio>

  <script>
    // ==========================================
    // ⚠️ 請填入您的 Google Apps Script 網頁應用程式網址
    // ==========================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxwqjU6qdPHLyL-Cd0EIwePjqhN6JTEj4ci6OOnkc2GEPjoUlYvHZkL5jAnynUSyJJe/exec';

    let flashcardsData = [];

    // Toast 訊息顯示
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.className = `fixed top-5 z-50 transition-all duration-300 transform translate-y-0 opacity-100 px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold ${
        isError ? 'bg-rose-600 text-white' : 'bg-stone-900 text-white'
      }`;
      setTimeout(() => {
        toast.className = 'fixed top-5 z-50 transition-all duration-300 transform -translate-y-20 opacity-0 pointer-events-none px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold';
      }, 3500);
    }

    // --- 本機拼音 + 注音解析核心 ---
    function parsePinyinAndZhuyin(text) {
      if (!window.pinyinPro) {
        return { pinyin: '', zhuyin: '' };
      }
      try {
        // 取得標準聲調拼音
        const pinyin = pinyinPro.pinyin(text, { toneType: 'symbol', type: 'string' });
        // 取得臺灣教育部注音符號
        const zhuyin = pinyinPro.pinyin(text, { pattern: 'zhuyin', type: 'string' });
        return { pinyin, zhuyin };
      } catch (e) {
        console.error('拼音解析失敗：', e);
        return { pinyin: '', zhuyin: '' };
      }
    }

    // --- 自動辨識與例句生成核心功能 ---
    async function autoFillDetails(target = 'create') {
      const hanziInput = document.getElementById(target === 'create' ? 'hanzi' : 'editHanzi');
      const hanzi = (hanziInput.value || '').trim();
      if (!hanzi) {
        showToast('請先輸入漢字！', true);
        hanziInput.focus();
        return;
      }

      const pinyinField = document.getElementById(target === 'create' ? 'pinyin' : 'editPinyin');
      const zhuyinField = document.getElementById(target === 'create' ? 'zhuyin' : 'editZhuyin');
      const englishField = document.getElementById(target === 'create' ? 'english' : 'editEnglish');
      const sentenceField = document.getElementById(target === 'create' ? 'sentence' : 'editSentence');

      // 1. 本機端直接生成拼音與注音（零延遲，保證成功）
      const phonetic = parsePinyinAndZhuyin(hanzi);
      if (phonetic.pinyin) pinyinField.value = phonetic.pinyin;
      if (phonetic.zhuyin) zhuyinField.value = phonetic.zhuyin;

      // 2. 向 Apps Script 請求英文翻譯與例句
      const btn = document.getElementById(target === 'create' ? 'btnAutoFillCreate' : 'btnAutoFillEdit');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span>⏳ 翻譯中...</span>';
      btn.disabled = true;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=autoFill&hanzi=${encodeURIComponent(hanzi)}`);
        const result = await res.json();

        if (result.status === 'success' && result.data) {
          if (result.data.english) englishField.value = result.data.english;
          if (result.data.sentence) sentenceField.value = result.data.sentence;
        } else {
          // 網路若有延遲，提供在地預設例句
          if (!sentenceField.value) sentenceField.value = `我很喜歡${hanzi}。`;
        }

        showToast('✨ 拼音、注音、英譯與例句已全數帶入！');

      } catch (err) {
        console.warn('翻譯伺服器稍慢，已先填入拼音與注音');
        if (!sentenceField.value) sentenceField.value = `我很喜歡${hanzi}。`;
        showToast('拼音與注音已帶入！');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    // 輸入漢字按 Enter 鍵亦可觸發自動填寫
    document.getElementById('hanzi').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        autoFillDetails('create');
      }
    });

    function extractDriveId(urlOrId) {
      if (!urlOrId) return '';
      const str = String(urlOrId).trim();
      const match = str.match(/[-\w]{25,}/);
      return match ? match[0] : str;
    }

    function parseDriveImageUrl(rawInput) {
      const fileId = extractDriveId(rawInput);
      return fileId ? `https://lh3.googleusercontent.com/d/${fileId}` : '';
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // --- 新增字卡錄音 ---
    let mediaRecorder;
    let audioChunks = [];
    let recordedAudioBlob = null;
    let isRecording = false;

    const recordBtn = document.getElementById('recordBtn');
    const recordText = document.getElementById('recordText');
    const recordDot = document.getElementById('recordDot');
    const recordStatus = document.getElementById('recordStatus');
    const audioPreview = document.getElementById('audioPreview');

    recordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            audioPreview.src = URL.createObjectURL(recordedAudioBlob);
            audioPreview.classList.remove('hidden');
            recordStatus.innerText = '錄音完成！可點擊右方試聽';
          };

          mediaRecorder.start();
          isRecording = true;
          recordText.innerText = '停止錄音';
          recordDot.classList.add('animate-ping');
          recordStatus.innerText = '正在錄音中...';
        } catch (err) {
          showToast('無法取得麥克風權限', true);
        }
      } else {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        isRecording = false;
        recordText.innerText = '重新錄音';
        recordDot.classList.remove('animate-ping');
      }
    });

    // --- 新增字卡表單送出 ---
    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '儲存至 Google 雲端中，請稍候...';

      try {
        const hanzi = document.getElementById('hanzi').value;
        const pinyin = document.getElementById('pinyin').value;
        const zhuyin = document.getElementById('zhuyin').value;
        const english = document.getElementById('english').value;
        const sentence = document.getElementById('sentence').value;
        const imageFile = document.getElementById('imageInput').files[0];

        let imageBase64 = '', imageName = '', imageMimeType = '';
        if (imageFile) {
          imageBase64 = await toBase64(imageFile);
          imageName = `${hanzi}_img_${Date.now()}`;
          imageMimeType = imageFile.type;
        }

        let audioBase64 = '', audioName = '', audioMimeType = '';
        if (recordedAudioBlob) {
          audioBase64 = await toBase64(recordedAudioBlob);
          audioName = `${hanzi}_audio_${Date.now()}.webm`;
          audioMimeType = recordedAudioBlob.type;
        }

        const payload = {
          action: 'add',
          hanzi, pinyin, zhuyin, english, sentence,
          imageBase64, imageName, imageMimeType,
          audioBase64, audioName, audioMimeType
        };

        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        showToast('字卡建立成功！已同步至 Google 雲端。');
        document.getElementById('createForm').reset();
        audioPreview.classList.add('hidden');
        recordedAudioBlob = null;
        recordText.innerText = '開始錄音';
        
        setTimeout(loadFlashcards, 2500);

      } catch (err) {
        console.error(err);
        showToast('上傳儲存失敗，請檢查網路連線。', true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '同步儲存至 Google 雲端';
      }
    });

    // --- 編輯 Modal 與錄音控制 ---
    let editMediaRecorder;
    let editAudioChunks = [];
    let editRecordedBlob = null;
    let isEditRecording = false;

    const editRecordBtn = document.getElementById('editRecordBtn');
    const editRecordText = document.getElementById('editRecordText');
    const editRecordDot = document.getElementById('editRecordDot');
    const editAudioPreview = document.getElementById('editAudioPreview');

    editRecordBtn.addEventListener('click', async () => {
      if (!isEditRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          editMediaRecorder = new MediaRecorder(stream);
          editAudioChunks = [];

          editMediaRecorder.ondataavailable = e => { if (e.data.size > 0) editAudioChunks.push(e.data); };
          editMediaRecorder.onstop = () => {
            editRecordedBlob = new Blob(editAudioChunks, { type: 'audio/webm' });
            editAudioPreview.src = URL.createObjectURL(editRecordedBlob);
            editAudioPreview.classList.remove('hidden');
          };

          editMediaRecorder.start();
          isEditRecording = true;
          editRecordText.innerText = '停止重錄';
          editRecordDot.classList.add('animate-ping');
        } catch (err) {
          showToast('無法取得麥克風權限', true);
        }
      } else {
        editMediaRecorder.stop();
        editMediaRecorder.stream.getTracks().forEach(track => track.stop());
        isEditRecording = false;
        editRecordText.innerText = '再次重錄';
        editRecordDot.classList.remove('animate-ping');
      }
    });

    function openEditModal(card) {
      document.getElementById('editRowIndex').value = card.rowIndex;
      document.getElementById('editHanzi').value = card.hanzi || '';
      document.getElementById('editPinyin').value = card.pinyin || '';
      document.getElementById('editZhuyin').value = card.zhuyin || '';
      document.getElementById('editEnglish').value = card.english || '';
      document.getElementById('editSentence').value = card.sentence || '';
      
      document.getElementById('editImageInput').value = '';
      editRecordedBlob = null;
      editAudioPreview.classList.add('hidden');
      editRecordText.innerText = '開始重錄';
      editRecordDot.classList.remove('animate-ping');

      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      if (isEditRecording && editMediaRecorder) {
        editMediaRecorder.stop();
        editMediaRecorder.stream.getTracks().forEach(t => t.stop());
        isEditRecording = false;
      }
      document.getElementById('editModal').classList.add('hidden');
    }

    // --- 送出編輯更新 ---
    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveEditBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = '更新中...';

      try {
        const rowIndex = document.getElementById('editRowIndex').value;
        const hanzi = document.getElementById('editHanzi').value;
        const pinyin = document.getElementById('editPinyin').value;
        const zhuyin = document.getElementById('editZhuyin').value;
        const english = document.getElementById('editEnglish').value;
        const sentence = document.getElementById('editSentence').value;
        const imageFile = document.getElementById('editImageInput').files[0];

        let imageBase64 = '', imageName = '', imageMimeType = '';
        if (imageFile) {
          imageBase64 = await toBase64(imageFile);
          imageName = `${hanzi}_img_${Date.now()}`;
          imageMimeType = imageFile.type;
        }

        let audioBase64 = '', audioName = '', audioMimeType = '';
        if (editRecordedBlob) {
          audioBase64 = await toBase64(editRecordedBlob);
          audioName = `${hanzi}_audio_${Date.now()}.webm`;
          audioMimeType = editRecordedBlob.type;
        }

        const payload = {
          action: 'update',
          rowIndex,
          hanzi, pinyin, zhuyin, english, sentence,
          imageBase64, imageName, imageMimeType,
          audioBase64, audioName, audioMimeType
        };

        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        showToast('字卡修改成功！');
        closeEditModal();
        setTimeout(loadFlashcards, 2000);

      } catch (err) {
        console.error(err);
        showToast('更新失敗，請檢查網路狀態', true);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = '儲存變更';
      }
    });

    // --- 移除字卡功能 ---
    async function deleteCard(card, btnEl) {
      const confirmDelete = confirm(`確定要移除字卡「${card.hanzi}」嗎？\n此動作將一併從試算表與雲端硬碟中刪除。`);
      if (!confirmDelete) return;

      const cardEl = btnEl.closest('.card-item');
      btnEl.disabled = true;
      btnEl.innerText = '刪除中...';

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'delete',
            rowIndex: card.rowIndex
          })
        });

        showToast(`已成功移除字卡「${card.hanzi}」`);
        if (cardEl) cardEl.remove();
        setTimeout(loadFlashcards, 1500);

      } catch (err) {
        console.error('刪除失敗：', err);
        showToast('移除失敗，請稍後再試', true);
        btnEl.disabled = false;
        btnEl.innerText = '🗑️ 移除';
      }
    }

    // --- 音訊播放邏輯 ---
    async function playAudio(audioInput, btnEl) {
      const fileId = extractDriveId(audioInput);
      if (!fileId) {
        showToast('此卡片尚未設定音檔', true);
        return;
      }

      const player = document.getElementById('globalAudio');
      const originalText = btnEl ? btnEl.innerHTML : '';

      try {
        if (btnEl) {
          btnEl.innerHTML = '⏳ 讀取中...';
          btnEl.disabled = true;
        }

        const res = await fetch(`${SCRIPT_URL}?audioId=${fileId}`);
        const result = await res.json();

        if (result.status !== 'success' || !result.data) {
          throw new Error(result.message || '無法取得音訊串流');
        }

        player.src = `data:${result.mimeType || 'audio/mpeg'};base64,${result.data}`;
        if (btnEl) btnEl.innerHTML = '🔊 播放中...';
        await player.play();

        player.onended = () => {
          if (btnEl) {
            btnEl.innerHTML = originalText;
            btnEl.disabled = false;
          }
        };

      } catch (err) {
        console.error('音訊播放失敗：', err);
        showToast('播放失敗，請確認檔案分享權限', true);
        if (btnEl) {
          btnEl.innerHTML = originalText;
          btnEl.disabled = false;
        }
      }
    }

    // --- 載入現有字卡清單 ---
    async function loadFlashcards() {
      const grid = document.getElementById('cardGrid');
      const loading = document.getElementById('loading');
      grid.innerHTML = '';
      loading.classList.remove('hidden');

      try {
        const res = await fetch(SCRIPT_URL);
        flashcardsData = await res.json();
        loading.classList.add('hidden');

        if (!flashcardsData || flashcardsData.length === 0) {
          loading.innerHTML = '<span>目前教材庫中尚無字卡。</span>';
          loading.classList.remove('hidden');
          return;
        }

        flashcardsData.forEach(card => {
          const directImg = parseDriveImageUrl(card.image_url);
          const rawAudio = card.audio_url || '';

          const cardEl = document.createElement('div');
          cardEl.className = 'card-item relative bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden p-5 flex flex-col items-center text-center hover:shadow-md transition';
          
          cardEl.innerHTML = `
            <div class="absolute top-3 right-3 flex items-center gap-1.5 z-10">
              <button class="edit-btn text-[11px] font-semibold text-amber-700 hover:text-white bg-amber-50 hover:bg-amber-600 border border-amber-200 px-2 py-1 rounded-lg transition shadow-sm" title="編輯此字卡">
                ✏️ 編輯
              </button>
              <button class="delete-btn text-[11px] font-semibold text-rose-500 hover:text-white bg-rose-50 hover:bg-rose-600 border border-rose-200 px-2 py-1 rounded-lg transition shadow-sm" title="移除此字卡">
                🗑️ 移除
              </button>
            </div>

            ${directImg ? `<img src="${directImg}" class="w-full h-36 object-cover rounded-xl mb-3 bg-stone-100" alt="${card.hanzi}" onerror="this.style.display='none'">` : ''}
            <div class="text-xs text-amber-700 font-bold mb-1 tracking-wider">${card.pinyin || ''} ${card.zhuyin ? '· ' + card.zhuyin : ''}</div>
            <div class="text-3xl font-black text-stone-900 mb-1 hover:text-amber-600 transition-colors">${card.hanzi}</div>
            <div class="text-xs text-stone-500 mb-3">${card.english || ''}</div>
            ${card.sentence ? `<p class="text-xs text-stone-600 bg-stone-50 p-2.5 rounded-lg w-full mb-3 text-left">"${card.sentence}"</p>` : ''}
            
            <button class="audio-btn mt-auto px-4 py-1.5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white rounded-full text-xs font-medium flex items-center justify-center gap-1.5 shadow-sm transition">
              🔊 播放試聽
            </button>
          `;

          const editBtn = cardEl.querySelector('.edit-btn');
          editBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            openEditModal(card);
          });

          const delBtn = cardEl.querySelector('.delete-btn');
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteCard(card, delBtn);
          });

          const btn = cardEl.querySelector('.audio-btn');
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            playAudio(rawAudio, btn);
          });

          grid.appendChild(cardEl);
        });

      } catch (err) {
        console.error(err);
        loading.innerHTML = '<span class="text-rose-500">載入教材失敗，請確認 Apps Script 部署狀態。</span>';
      }
    }

    // 初次載入
    loadFlashcards();
  </script>
</body>
</html>
